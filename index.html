<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Multi-Node Console</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --glow: #00f2ff;
            --gold: #d4af37;
            --danger: #ff3366;
            --ui-bg: rgba(0, 10, 20, 0.85);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100dvh;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; 
        }

        /* Video Engine */
        .video-engine {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100dvh;
            z-index: 1;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease-in-out;
            opacity: 1;
            background-color: #000;
        }
        
        .video-engine.fade-out {
            opacity: 0;
        }

        #yt-iframe {
            width: 100vw; height: 56.25vw;
            min-height: 100dvh; min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            pointer-events: none;
        }

        /* Mirror Toggle Button */
        .mirror-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 250;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            opacity: 0.6;
        }
        .mirror-btn:hover {
            opacity: 1;
            border-color: var(--glow);
            box-shadow: 0 0 15px var(--glow);
        }
        .mirror-btn svg { width: 20px; fill: var(--glow); }
        .mirrored { transform: scaleX(-1); }

        /* Draggable Glass Button */
        .glass-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 250;
            padding: 12px 20px;
            background: rgba(0, 10, 20, 0.4);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 30px;
            color: var(--glow);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            cursor: grab;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
            transition: border-color 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .glass-btn:hover {
            border-color: var(--glow);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }
        .glass-btn:active { cursor: grabbing; }

        /* UI Overlay */
        #nexus-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            transition: opacity 0.4s ease, visibility 0.4s;
            cursor: pointer;
        }

        .holo-frame {
            width: min(420px, 85vw);
            padding: 40px;
            background: var(--ui-bg);
            border: 2.5px solid var(--glow);
            border-radius: 30px;
            text-align: center;
            color: #fff;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
            position: relative;
        }

        /* Close Button inside Overlay */
        .close-ui-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--glow);
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.3s;
        }
        .close-ui-btn:hover { opacity: 1; text-shadow: 0 0 10px var(--glow); }

        .btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--glow);
            color: var(--glow);
            background: rgba(0, 242, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover { background: var(--glow); color: #000; box-shadow: 0 0 15px var(--glow); }
        
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #000; box-shadow: 0 0 15px var(--danger); }

        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-row .btn { margin-top: 0; }

        .hud {
            position: fixed;
            bottom: 30px;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.6);
            z-index: 150;
            transition: 0.5s;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Swipe Indicator */
        .swipe-indicator {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: var(--glow);
            z-index: 150;
            opacity: 0.5;
            transition: opacity 0.5s;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .swipe-indicator .chevron {
            font-size: 1.2rem;
            animation: swipe-pulse 2s infinite ease-in-out;
        }
        .swipe-indicator .chevron.left { animation-delay: 0s; }
        .swipe-indicator .chevron.right { animation-delay: 1s; }

        @keyframes swipe-pulse {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); text-shadow: 0 0 10px var(--glow); }
        }

        .hidden { opacity: 0 !important; visibility: hidden !important; transition: opacity 0.3s ease, visibility 0.3s; }
        
        .loading-text { color: var(--gold); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <!-- Removed onclick from the background engine -->
    <div id="engine" class="video-engine">
        <iframe id="yt-iframe" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="mirror-btn" onclick="toggleMirror(event)" title="Mirror Perspective">
        <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
    </div>

    <!-- Draggable Floating Action Button -->
    <div id="nexus-fab" class="glass-btn">
        ⏣ COM-LINK
    </div>

    <!-- UI Overlay -->
    <div id="nexus-overlay" class="hidden" onclick="if(event.target.id === 'nexus-overlay') closeUI();">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <div class="close-ui-btn" onclick="closeUI()">×</div>
            <h1 id="node-title" style="margin:0; font-size: 1.1rem; letter-spacing: 4px; color: var(--glow);">SYSTEM BOOT</h1>
            <p id="node-status" style="font-size: 0.6rem; opacity: 0.6; margin-top: 10px;">LOADING NODES...</p>
            
            <div class="btn-row">
                <button class="btn" onclick="promptAddNode()">+ Add Feed</button>
                <button class="btn btn-danger" onclick="removeCurrentNode()">- Remove Feed</button>
            </div>
            
            <a href="mailto:stakeme10000@gmail.com" class="btn">Request Console</a>
            <a href="https://architect-artemis.vercel.app/" target="_blank" class="btn" style="border-color:var(--gold); color:var(--gold);">Visit Olympus</a>
        </div>
    </div>

    <div class="hud" style="left: 30px;" id="hud-L">NODE: --/--</div>
    
    <div class="swipe-indicator hud">
        <span class="chevron left">‹‹</span> SWIPE NEXUS <span class="chevron right">››</span>
    </div>

    <script>
        // ==========================================
        // SUPABASE UPLINK & CONFIGURATION
        // ==========================================
        const supabaseUrl = 'https://dfooodizpfqxcbhzadrb.supabase.co';
        const supabaseAnonKey = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmb29vZGl6cGZxeGNiaHphZHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTkwMTgsImV4cCI6MjA5OTE3NTAxOH0.Fl5cmNxR2wnZQW1tBIXFo6gG6E-mFdR4oAfy3rK4dq0';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

        // Core System Variables
        let nodes = [];
        let currentIndex = 0;
        const iframe = document.getElementById('yt-iframe');
        const engine = document.getElementById('engine');
        const overlay = document.getElementById('nexus-overlay');
        const huds = document.querySelectorAll('.hud');
        const fab = document.getElementById('nexus-fab');
        
        // Swipe & Fade tracking variables
        let touchStartX = 0;
        let touchEndX = 0;
        const swipeThreshold = 40; 
        let isTransitioning = false; 
        let fadeTimeout;
        let safetyTimeout;

        // Fallback Database
        const defaultNodes = [
            { id: "DHUnz4dyb54", name: "GEORGIA AQUARIUM" },
            { id: "XsOU8JnEpNM", name: "OL DONYO LODGE" },
            { id: "5e4lsEe4Vew", name: "WOLF CENTER NORTH" },
            { id: "3n-5EA9augs", name: "TEXAS WILDLIFE" },
            { id: "dIChLG4_WNs", name: "NKORHO BUSH LODGE" },
            { id: "ItdXaWUVF48", name: "ROSIE'S PAN AFRICA" },
            { id: "ydYDqZQpim8", name: "NAMIB DESERT LIVE" },
            { id: "S46DdA8Mc4I", name: "MAKOV STORK NEST" },
            { id: "qHXFLsnKDq0", name: "MOUNTAIN STREAM" },
            { id: "F0GOOP82094", name: "MORTEN HILMER FOREST" },
            { id: "4BrvMGznLTo", name: "MOUNTAIN WATERFALL" }
            // Keeping list concise for template, rest of defaults load normally
        ];

        // ==========================================
        // FAB DRAGGING LOGIC
        // ==========================================
        let isDraggingFab = false;
        let didDrag = false;
        let startX, startY, initialX, initialY;

        function dragStart(e) {
            isDraggingFab = true;
            didDrag = false;
            
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }

            const rect = fab.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchend', dragEnd);
        }

        function drag(e) {
            if (!isDraggingFab) return;
            
            let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            let dx = clientX - startX;
            let dy = clientY - startY;
            
            // If moved more than 3px, consider it a drag and not a click
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                didDrag = true;
                e.preventDefault(); 
            }
            
            let newX = initialX + dx;
            let newY = initialY + dy;
            
            // Boundaries
            newX = Math.max(0, Math.min(newX, window.innerWidth - fab.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - fab.offsetHeight));
            
            fab.style.left = newX + 'px';
            fab.style.top = newY + 'px';
            fab.style.right = 'auto'; 
            fab.style.bottom = 'auto';
        }

        function dragEnd() {
            isDraggingFab = false;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchend', dragEnd);
        }

        fab.addEventListener('mousedown', dragStart);
        fab.addEventListener('touchstart', dragStart, {passive: false});

        fab.addEventListener('click', (e) => {
            if (didDrag) return; // Prevent opening UI if user was just moving the button
            openUI();
        });

        // ==========================================
        // NODE MANAGEMENT LOGIC
        // ==========================================
        
        async function initSystem() {
            document.getElementById('node-status').innerText = "ESTABLISHING DATABASE UPLINK...";
            
            const { data, error } = await supabaseClient
                .from('nexus_nodes')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Database connection failed:', error);
                document.getElementById('node-status').innerText = "UPLINK FAILED. USING LOCAL CACHE.";
                nodes = [...defaultNodes];
            } else if (data && data.length > 0) {
                nodes = data; 
            } else {
                nodes = [...defaultNodes];
            }
            
            updateNode();
        }

        function extractYouTubeID(url) {
            const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/|shorts\/))([\w-]{11})/;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }

        async function promptAddNode() {
            const url = prompt("Enter YouTube URL (Live, Shorts, or Standard):");
            if (!url) return;

            const ytId = extractYouTubeID(url);
            if (!ytId) {
                alert("SYSTEM ERROR: Invalid or unrecognizable YouTube URL format.");
                return;
            }

            const customName = prompt("Enter a Name for this feed:", "CUSTOM USER FEED") || "CUSTOM FEED";
            
            const { data, error } = await supabaseClient
                .from('nexus_nodes')
                .insert([{ id: ytId, name: customName.toUpperCase() }])
                .select(); 

            if (error) {
                console.error("Insert error:", error);
                alert("UPLOAD FAILED. Node ID may already exist in the database.");
                return;
            }

            nodes.push({ id: ytId, name: customName.toUpperCase() });
            currentIndex = nodes.length - 1;
            updateNode();
        }

        async function removeCurrentNode() {
            if (nodes.length <= 1) {
                alert("SYSTEM LOCK: Cannot remove the final active feed.");
                return;
            }
            
            const nodeToDelete = nodes[currentIndex];
            
            if (confirm(`PURGE "${nodeToDelete.name}" FROM GLOBAL DATABASE?`)) {
                const { error } = await supabaseClient
                    .from('nexus_nodes')
                    .delete()
                    .eq('id', nodeToDelete.id);

                if (error) {
                    console.error("Delete error:", error);
                    alert("PURGE FAILED. Check console for details.");
                    return;
                }

                nodes.splice(currentIndex, 1);
                if (currentIndex >= nodes.length) currentIndex = 0;
                updateNode();
            }
        }

        // ==========================================
        // UI, HARDWARE CONTROLS & SWIPE LOGIC
        // ==========================================
        
        function updateNode() {
            if(nodes.length === 0) return;
            const node = nodes[currentIndex];
            
            clearTimeout(fadeTimeout);
            clearTimeout(safetyTimeout);
            
            engine.classList.add('fade-out');
            
            const hudText = document.getElementById('hud-L');
            hudText.innerHTML = `[ <span class="loading-text">ESTABLISHING CONNECTION...</span> ]`;
            
            fadeTimeout = setTimeout(() => {
                iframe.src = `https://www.youtube.com/embed/${node.id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${node.id}&rel=0&modestbranding=1`;
                document.getElementById('node-title').innerText = node.name;
                document.getElementById('node-status').innerText = `ACTIVE FEED: NODE_${String(currentIndex + 1).padStart(2, '0')}`;
                
                iframe.onload = () => {
                    engine.classList.remove('fade-out');
                    hudText.innerText = `NODE: ${String(currentIndex + 1).padStart(2, '0')}/${nodes.length}`;
                    isTransitioning = false; 
                };

                safetyTimeout = setTimeout(() => {
                    engine.classList.remove('fade-out');
                    hudText.innerText = `NODE: ${String(currentIndex + 1).padStart(2, '0')}/${nodes.length}`;
                    isTransitioning = false;
                }, 2000);

            }, 500); 
        }

        function toggleMirror(e) {
            e.stopPropagation();
            engine.classList.toggle('mirrored');
        }

        function closeUI() {
            overlay.classList.add('hidden');
            fab.style.display = 'flex';
        }

        function openUI() {
            overlay.classList.remove('hidden');
            fab.style.display = 'none'; // Hide FAB while menu is open
        }

        function cycleNode(direction) {
            if (isTransitioning) return; 
            isTransitioning = true;
            currentIndex = (currentIndex + direction + nodes.length) % nodes.length;
            updateNode();
        }

        function handleSwipe() {
            const distance = touchEndX - touchStartX;
            
            if (distance < -swipeThreshold) {
                cycleNode(1);
            } else if (distance > swipeThreshold) {
                cycleNode(-1);
            }
        }

        // Swiping Logic (Background Only)
        document.body.addEventListener('touchstart', (e) => {
            if (e.target.closest('.glass-btn') || e.target.closest('#nexus-overlay') || e.target.closest('.mirror-btn')) return;
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.body.addEventListener('touchend', (e) => {
            if (e.target.closest('.glass-btn') || e.target.closest('#nexus-overlay') || e.target.closest('.mirror-btn')) return;
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        // Desktop Drag-to-swipe
        let isSwipingBg = false;
        document.body.addEventListener('mousedown', (e) => {
            if (e.target.closest('.glass-btn') || e.target.closest('#nexus-overlay') || e.target.closest('.mirror-btn')) return;
            isSwipingBg = true;
            touchStartX = e.screenX;
        });

        document.body.addEventListener('mouseup', (e) => {
            if (!isSwipingBg) return;
            isSwipingBg = false;
            touchEndX = e.screenX;
            handleSwipe();
        });

        // ==========================================
        // SILENT MULTIVERSE TRACKER LOGIC
        // ==========================================
        async function silentUplink() {
            try {
                let visitorId = localStorage.getItem('nexus_visitor_id');
                if (!visitorId) {
                    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                        visitorId = crypto.randomUUID();
                    } else {
                        visitorId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                            const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                            return v.toString(16);
                        });
                    }
                    localStorage.setItem('nexus_visitor_id', visitorId);
                }
                await supabaseClient.rpc('track_ping', { p_ip_hash: visitorId });
            } catch (error) {
                console.error("Telemetry Error:", error);
            }
        }

        window.addEventListener('load', () => {
            initSystem();
            silentUplink();
            setInterval(silentUplink, 60000); 
        });
    </script>
</body>
</html>
