<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multi-Node Console</title>
    <style>
        :root {
            --glow: #00f2ff;
            --gold: #d4af37;
            --danger: #ff3366;
            --ui-bg: rgba(0, 10, 20, 0.85);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
        }

        /* Video Engine */
        .video-engine {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #yt-iframe {
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            pointer-events: none;
        }

        /* Mirror Toggle Button */
        .mirror-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 250;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            opacity: 0.6;
        }
        .mirror-btn:hover {
            opacity: 1;
            border-color: var(--glow);
            box-shadow: 0 0 15px var(--glow);
        }
        .mirror-btn svg { width: 20px; fill: var(--glow); }
        .mirrored { transform: scaleX(-1); }

        /* Nav Arrows */
        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            color: var(--glow);
            width: 80px; height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 3rem;
            font-weight: 100;
            transition: all 0.4s ease;
            user-select: none;
            opacity: 0.3;
            text-shadow: 0 0 10px var(--glow);
        }
        .nav-arrow:hover { opacity: 1; transform: translateY(-50%) scale(1.1); }
        .nav-arrow:active { transform: translateY(-50%) scale(0.9); transition: 0.05s; }
        .arrow-L { left: 10px; }
        .arrow-R { right: 10px; }

        /* UI Overlay */
        #nexus-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            transition: opacity 0.8s, visibility 0.8s;
            cursor: pointer;
        }

        .holo-frame {
            width: min(420px, 85vw);
            padding: 40px;
            background: var(--ui-bg);
            border: 2.5px solid var(--glow);
            border-radius: 30px;
            text-align: center;
            color: #fff;
            pointer-events: auto;
        }

        .btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--glow);
            color: var(--glow);
            background: rgba(0, 242, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover { background: var(--glow); color: #000; }
        
        .btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger); color: #000;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-row .btn { margin-top: 0; }

        .hud {
            position: fixed;
            /* Adjusted from 30px to 60px to clear the new cyber-footer */
            bottom: 60px;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            z-index: 150;
            transition: 0.5s;
        }

        .hidden { opacity: 0 !important; visibility: hidden !important; }

        /* Multiverse Tracker CSS Integration */
        .cyber-footer {
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            text-align: center; 
            padding: 12px 0;
            background: rgba(5, 5, 5, 0.85); 
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(0, 255, 255, 0.15); 
            z-index: 9999;
            font-family: 'Courier New', Courier, monospace;
            /* Prevents footer from intercepting background clicks intended for UI toggle */
            pointer-events: none; 
        }
        .visit-count {
            color: #00ffff; 
            font-size: 0.75rem; 
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8), 0 0 15px rgba(0, 255, 255, 0.4);
            letter-spacing: 1.5px; 
            text-transform: uppercase;
        }
        .loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body onclick="toggleUI()">

    <div id="engine" class="video-engine">
        <iframe id="yt-iframe" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="mirror-btn" onclick="toggleMirror(event)" title="Mirror Perspective">
        <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
    </div>

    <div class="nav-arrow arrow-L" onclick="cycleNode(-1)">‹</div>
    <div class="nav-arrow arrow-R" onclick="cycleNode(1)">›</div>

    <div id="nexus-overlay">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <h1 id="node-title" style="margin:0; font-size: 1.1rem; letter-spacing: 4px; color: var(--glow);">SYSTEM BOOT</h1>
            <p id="node-status" style="font-size: 0.6rem; opacity: 0.6; margin-top: 10px;">LOADING NODES...</p>
            
            <div class="btn-row">
                <button class="btn" onclick="promptAddNode()">+ Add Feed</button>
                <button class="btn btn-danger" onclick="removeCurrentNode()">- Remove Feed</button>
            </div>
            
            <a href="mailto:stakeme10000@gmail.com" class="btn">Request Console</a>
            <a href="https://architect-artemis.vercel.app/" target="_blank" class="btn" style="border-color:var(--gold); color:var(--gold);">Visit Olympus</a>
        </div>
    </div>

    <div class="hud" style="left: 30px;" id="hud-L">NODE: --/--</div>

    <footer class="cyber-footer">
        <div class="visit-count" id="counter-display">
            UPLINK ESTABLISHING <span class="loading">...</span>
        </div>
    </footer>

    <script>
        // Initial Database
        const defaultNodes = [

            { id: "ItdXaWUVF48", name: "ROSIE'S PAN AFRICA" },
            { id: "ydYDqZQpim8", name: "NAMIB DESERT LIVE" },

            { id: "qHXFLsnKDq0", name: "MOUNTAIN STREAM" },
            { id: "F0GOOP82094", name: "MORTEN HILMER FOREST" },
            { id: "4BrvMGznLTo", name: "MOUNTAIN WATERFALL" },
            { id: "ayMw6zvsUpQ", name: "PACIFIC REEF CAM" },
            { id: "iws3rh5vLAQ", name: "KILAUEA VOLCANO" },
            { id: "jzx_n25g3kA", name: "UTOPIA UNDERWATER" },
            { id: "ouWBQoVFegI", name: "BALD EAGLE NEST" },
            { id: "3szkFHfr6sA", name: "WOLONG PANDA GROVE" },

            { id: "aXAsMcmtJTc", name: "NETHERLANDS SEAL CAM" },
            { id: "qJ8lYplu1y0", name: "MAUNAKEA METEOR CAM" },
            { id: "yfSyjwY6zSQ", name: "GRACE GORILLA FOREST" },
            { id: "azNqXbUW-K4", name: "TROPICAL FISH CAM" },
            { id: "yuIm1V7Ne7I", name: "ONGUMA WATERHOLE" },
            { id: "QOzC_AbsPlw", name: "SPACE AMBIENT HUD" },
            { id: "XyPU5-pNg5E", name: "AQUARIUM FEED 01" },
            { id: "Io1Kle7QR-E", name: "AQUARIUM FEED 02" },
            { id: "RZFMYVNhd4k", name: "AQUARIUM FEED 03" },
            { id: "JMMoRwYo5kE", name: "AQUARIUM FEED 04" },
            { id: "HlJ4aRtYhoo", name: "AQUARIUM FEED 05" },
            { id: "iWCeBAxRCBo", name: "AQUARIUM FEED 06" },

            { id: "abbR-Ttd-cA", name: "AQUARIUM FEED 11" },
            { id: "dN1uDn-Luno", name: "AQUARIUM FEED 12" },

            { id: "qi0mY6zVQnY", name: "AQUARIUM FEED 14" },
            { id: "MwcqP3ta6RI", name: "AQUARIUM FEED 15" },
            { id: "fIMbMz2P7Bs", name: "AQUARIUM FEED 16" },
            { id: "h8O0UXsL7uk", name: "AQUARIUM FEED 17" },
            { id: "0FBiyFpV__g", name: "AQUARIUM FEED 18" },
            { id: "UDAZWxehMAI", name: "AQUARIUM FEED 19" },
            { id: "w3LjpFhySTg", name: "AQUARIUM FEED 20" },
            { id: "3e_uPkJCTNo", name: "AQUARIUM FEED 21" },
            { id: "ZrePsYz4c6g", name: "AQUARIUM FEED 22" },
            { id: "gJVnp5fF0vM", name: "AQUARIUM FEED 23" },
            { id: "-Vck0hn-zqk", name: "AQUARIUM FEED 24" },
            { id: "typxqJU-pFQ", name: "AQUARIUM FEED 25" },
            { id: "UpwNqncnqTE", name: "AQUARIUM FEED 26" },
            { id: "E0TZTmTK-Ws", name: "AQUARIUM FEED 27" }
        ];

        let nodes = [];
        let currentIndex = 0;
        const iframe = document.getElementById('yt-iframe');
        const engine = document.getElementById('engine');
        const overlay = document.getElementById('nexus-overlay');
        const huds = document.querySelectorAll('.hud');

        function initSystem() {
            const savedData = localStorage.getItem('nexusNodes');
            if (savedData) {
                nodes = JSON.parse(savedData);
            } else {
                nodes = [...defaultNodes];
            }
            updateNode();
        }

        function saveSystemState() {
            localStorage.setItem('nexusNodes', JSON.stringify(nodes));
        }

        function extractYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function promptAddNode() {
            const url = prompt("Enter YouTube Live Stream URL:");
            if (!url) return;

            const ytId = extractYouTubeID(url);
            if (!ytId) {
                alert("Invalid YouTube URL.");
                return;
            }

            const customName = prompt("Enter a Name for this feed:", "CUSTOM USER FEED") || "CUSTOM FEED";
            
            nodes.push({ id: ytId, name: customName.toUpperCase() });
            saveSystemState();
            
            currentIndex = nodes.length - 1;
            updateNode();
        }

        function removeCurrentNode() {
            if (nodes.length <= 1) {
                alert("Cannot remove the last remaining feed.");
                return;
            }
            
            if (confirm(`Remove "${nodes[currentIndex].name}" from your rotation?`)) {
                nodes.splice(currentIndex, 1);
                saveSystemState();
                
                if (currentIndex >= nodes.length) currentIndex = 0;
                updateNode();
            }
        }

        function updateNode() {
            if(nodes.length === 0) return;
            const node = nodes[currentIndex];
            iframe.src = `https://www.youtube.com/embed/${node.id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${node.id}&rel=0&modestbranding=1`;
            document.getElementById('node-title').innerText = node.name;
            document.getElementById('node-status').innerText = `ACTIVE FEED: NODE_${String(currentIndex + 1).padStart(2, '0')}`;
            document.getElementById('hud-L').innerText = `NODE: ${String(currentIndex + 1).padStart(2, '0')}/${nodes.length}`;
        }

        function toggleMirror(e) {
            e.stopPropagation();
            engine.classList.toggle('mirrored');
        }

        function cycleNode(direction) {
            event.stopPropagation();
            currentIndex = (currentIndex + direction + nodes.length) % nodes.length;
            updateNode();
        }

        function toggleUI() {
            overlay.classList.toggle('hidden');
            huds.forEach(h => h.classList.toggle('hidden'));
            // Optionally target the new footer as well if you want it to hide with the UI overlay:
            // document.querySelector('.cyber-footer').classList.toggle('hidden');
        }

        // Multiverse Tracker Uplink Logic
        async function updateMultiverseCount() {
            const displayElement = document.getElementById('counter-display');
            
            try {
                const API_ENDPOINT = 'https://multiverse-tracker-5sgfxx5nr-merlin-ambros-projects.vercel.app/api/increment-view';
                
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error('Network fault');

                const data = await response.json();
                
                displayElement.innerHTML = `
                    UNIQUE TRAVERSALS: [ <span style="color: #ff00ff; text-shadow: 0 0 10px #ff00ff;">${data.unique}</span> ] 
                    <span style="opacity: 0.5; margin: 0 10px;">///</span> 
                    TOTAL PINGS: [ <span style="color: #00ffff;">${data.total}</span> ]
                `;
                displayElement.classList.remove('loading');

            } catch (error) {
                console.error('Uplink failed:', error);
                displayElement.innerHTML = `MULTIVERSE NODE: [ <span style="color: #ff3366;">OFFLINE</span> ]`;
                displayElement.classList.remove('loading');
            }
        }

        // Boot sequences
        window.addEventListener('DOMContentLoaded', updateMultiverseCount);
        initSystem();
    </script>
</body>
</html>
