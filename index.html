<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Aquarium • Immersive</title>
    <style>
        :root {
            --glow: #00c3ff;
            --gold: #ffd700;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
        }

        /* The Base Layers (Full Screen, No Gaps) */
        .video-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #bg-render, #yt-iframe {
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect */
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            border: none;
        }

        /* YouTube sits above the Blob render */
        #yt-iframe { z-index: 2; pointer-events: none; }

        /* UI Layer */
        #ui-wrapper {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            transition: opacity 0.6s ease, visibility 0.6s;
            cursor: pointer;
        }

        .holo-frame {
            width: min(320px, 85vw);
            padding: 40px;
            background: rgba(0, 10, 20, 0.8);
            border: 1.5px solid var(--glow);
            border-radius: 24px;
            box-shadow: 0 0 30px var(--glow), inset 0 0 15px var(--glow);
            text-align: center;
            color: white;
            pointer-events: auto; /* Buttons still clickable */
        }

        .btn-stack { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .btn {
            padding: 12px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            border: 1px solid var(--glow);
            color: white;
            background: rgba(0, 195, 255, 0.1);
        }
        .btn:hover { background: var(--glow); color: #000; box-shadow: 0 0 15px var(--glow); }

        /* HUD Elements */
        .hud {
            position: fixed;
            z-index: 15;
            transition: opacity 0.5s;
            pointer-events: auto;
        }
        .bottom-L { bottom: 30px; left: 30px; }
        .bottom-R { bottom: 30px; right: 30px; }
        
        .nav-link {
            text-decoration: none;
            color: var(--gold);
            font-size: 0.7rem;
            border: 1px solid var(--gold);
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(0,0,0,0.5);
        }

        /* Utility Classes */
        .hidden { opacity: 0; visibility: hidden; }
    </style>
</head>
<body onclick="toggleNexusUI()">

    <div class="video-layer">
        <video id="bg-render" autoplay muted loop playsinline>
            <source src="https://w6gqoaajkeprilw9.public.blob.vercel-storage.com/nexus_render%20%289%29.webm" type="video/webm">
        </video>
    </div>

    <div class="video-layer">
        <iframe id="yt-iframe" 
            src="https://www.youtube.com/embed/DHUnz4dyb54?autoplay=1&mute=1&controls=0&loop=1&playlist=DHUnz4dyb54&rel=0&iv_load_policy=3&modestbranding=1" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div id="ui-wrapper">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <h2 style="margin:0; letter-spacing: 3px; text-shadow: 0 0 10px var(--glow);">AQUARIUM</h2>
            <p style="font-size: 0.7rem; opacity: 0.6; margin-top: 5px;">NEXUS NODE • REEF_FEED</p>
            
            <div class="btn-stack">
                <a href="mailto:stakeme10000@gmail.com" class="btn">Request Console</a>
                <a href="https://www.georgiaaquarium.org" target="_blank" class="btn" style="border-color: var(--gold); color: var(--gold);">Official Site</a>
            </div>
            <p style="font-size: 0.6rem; margin-top: 20px; opacity: 0.5;">TAP ANYWHERE TO HIDE UI</p>
        </div>
    </div>

    <div class="hud bottom-L">
        <a href="https://architect-artemis.vercel.app/" target="_blank" class="nav-link">RETURN TO OLYMPUS</a>
    </div>
    <div class="hud bottom-R">
        <a href="https://explore.org" target="_blank" class="nav-link" style="color: var(--glow); border-color: var(--glow);">EXPLORE.ORG</a>
    </div>

    <script>
        const ui = document.getElementById('ui-wrapper');
        const huds = document.querySelectorAll('.hud');

        function toggleNexusUI() {
            const isHidden = ui.classList.contains('hidden');
            
            if (isHidden) {
                ui.classList.remove('hidden');
                huds.forEach(h => h.classList.remove('hidden'));
            } else {
                ui.classList.add('hidden');
                huds.forEach(h => h.classList.add('hidden'));
            }
        }

        // Prevent UI from closing when clicking links or buttons
        document.querySelectorAll('a, .holo-frame').forEach(element => {
            element.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        });
    </script>
</body>
</html>
