<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Aquarium - Tropical Reef</title>
    <style>
        :root {
            --glow-color: rgba(0, 195, 255, 0.9);
            --olympian-glow: rgba(255, 215, 0, 0.7);
            --glass-bg: rgba(255, 255, 255, 0);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        /* The Base Render Background */
        .base-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Expandable YouTube Feed */
        #youtube-container {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 320px;
            height: 180px;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid var(--glow-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        #youtube-container.expanded {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15; /* Sits above base video but behind UI */
            border-radius: 0;
            border: none;
        }

        #youtube-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* UI Overlays */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.1);
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .holo-frame {
            position: relative;
            width: 320px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid var(--glow-color);
            border-radius: 24px;
            box-shadow: 0 0 25px var(--glow-color), inset 0 0 15px var(--glow-color);
            text-align: center;
            color: white;
            animation: breathe 4s infinite alternate;
        }

        @keyframes breathe {
            from { box-shadow: 0 0 15px var(--glow-color); }
            to { box-shadow: 0 0 40px var(--glow-color), inset 0 0 25px var(--glow-color); }
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
        }

        .olympian-btn {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid gold;
            color: #ffd700;
        }

        .olympian-btn:hover { background: gold; color: black; box-shadow: 0 0 20px gold; }

        .plan-btn {
            background: rgba(0, 195, 255, 0.1);
            border: 1px solid #00c3ff;
            color: white;
        }

        .plan-btn:hover { background: #00c3ff; box-shadow: 0 0 20px #00c3ff; }

        /* Floating Nav Buttons */
        .top-left-controls { position: fixed; top: 20px; left: 20px; z-index: 30; }
        .bottom-left-brand { position: fixed; bottom: 30px; left: 30px; z-index: 25; transition: 0.8s; }
        .controls-right { position: fixed; bottom: 30px; right: 30px; z-index: 25; transition: 0.8s; }
        #fs-toggle { position: fixed; top: 20px; right: 20px; z-index: 30; }

        .icon-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glow-color);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: 0.4s;
        }

        .icon-btn:hover { background: var(--glow-color); box-shadow: 0 0 15px var(--glow-color); }

        .hidden { opacity: 0 !important; visibility: hidden !important; }

    </style>
</head>
<body>

    <div class="top-left-controls">
        <button class="icon-btn" onclick="toggleYoutube()">Toggle Reef Feed</button>
    </div>

    <button id="fs-toggle" class="icon-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>

    <div class="base-background">
        <video id="bg-video" autoplay muted loop playsinline>
            <source src="https://w6gqoaajkeprilw9.public.blob.vercel-storage.com/nexus_render%20%289%29.webm" type="video/webm">
        </video>
    </div>

    <div id="youtube-container">
        <iframe src="https://www.youtube.com/embed/DHUnz4dyb54?autoplay=1&mute=1&controls=0&loop=1&playlist=DHUnz4dyb54&rel=0" allow="autoplay; fullscreen"></iframe>
    </div>

    <div id="ui-overlay" onclick="closeFrame(event)">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <h2 style="margin-top:0; text-shadow: 0 0 15px #00c3ff; letter-spacing: 2px;">GEORGIA AQUARIUM</h2>
            <p style="font-size: 0.85rem; opacity: 0.9;">System Active</p>
            
            <div class="btn-stack">
                <a href="mailto:stakeme10000@gmail.com?subject=Olympian Console Request" class="btn olympian-btn">
                    Request an Olympian console
                </a>
                <a href="https://www.georgiaaquarium.org/webcam/indo-pacific-barrier-reef/" target="_blank" class="btn plan-btn">
                    Plan Now
                </a>
            </div>
        </div>
    </div>

    <div class="bottom-left-brand">
        <a href="https://architect-artemis.vercel.app/" target="_blank" class="icon-btn" style="border-color: gold; color: gold;">Visit Olympus</a>
    </div>

    <div class="controls-right">
        <a href="https://explore.org" target="_blank" class="icon-btn">Explore.org</a>
    </div>

    <script>
        const overlay = document.getElementById('ui-overlay');
        const ytContainer = document.getElementById('youtube-container');
        const bottomLeft = document.querySelector('.bottom-left-brand');
        const bottomRight = document.querySelector('.controls-right');

        function toggleYoutube() {
            ytContainer.classList.toggle('expanded');
        }

        function closeFrame(event) {
            overlay.classList.add('hidden');
        }

        document.body.addEventListener('click', (e) => {
            if (overlay.classList.contains('hidden') && e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON') {
                overlay.classList.remove('hidden');
            }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                overlay.classList.add('hidden');
                bottomLeft.classList.add('hidden');
                bottomRight.classList.add('hidden');
            } else {
                overlay.classList.remove('hidden');
                bottomLeft.classList.remove('hidden');
                bottomRight.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
