<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multi-Node Console</title>
    <style>
        :root {
            --glow: #00f2ff;
            --gold: #d4af37;
            --ui-bg: rgba(0, 10, 20, 0.85);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
        }

        /* Video Engine with Mirror Support */
        .video-engine {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #yt-iframe {
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            pointer-events: none;
        }

        /* Mirror Toggle Button */
        .mirror-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 250;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            opacity: 0.6;
        }
        .mirror-btn:hover {
            opacity: 1;
            border-color: var(--glow);
            box-shadow: 0 0 15px var(--glow);
        }
        .mirror-btn svg {
            width: 20px;
            fill: var(--glow);
        }

        /* Mirror State */
        .mirrored {
            transform: scaleX(-1);
        }

        /* Nav Arrows */
        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            color: var(--glow);
            width: 80px; height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 3rem;
            font-weight: 100;
            transition: all 0.4s ease;
            user-select: none;
            opacity: 0.3;
            text-shadow: 0 0 10px var(--glow);
        }
        .nav-arrow:hover { opacity: 1; transform: translateY(-50%) scale(1.1); }
        .nav-arrow:active { transform: translateY(-50%) scale(0.9); transition: 0.05s; }
        .arrow-L { left: 10px; }
        .arrow-R { right: 10px; }

        /* UI Overlay */
        #nexus-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            transition: opacity 0.8s, visibility 0.8s;
            cursor: pointer;
        }

        .holo-frame {
            width: min(380px, 85vw);
            padding: 40px;
            background: var(--ui-bg);
            border: 2.5px solid var(--glow);
            border-radius: 30px;
            text-align: center;
            color: #fff;
            pointer-events: auto;
        }

        .btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--glow);
            color: var(--glow);
            background: rgba(0, 242, 255, 0.05);
            transition: 0.3s;
        }
        .btn:hover { background: var(--glow); color: #000; }

        .hud {
            position: fixed;
            bottom: 30px;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            z-index: 150;
            transition: 0.5s;
        }

        .hidden { opacity: 0 !important; visibility: hidden !important; }
    </style>
</head>
<body onclick="toggleUI()">

    <div id="engine" class="video-engine">
        <iframe id="yt-iframe" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="mirror-btn" onclick="toggleMirror(event)" title="Mirror Perspective">
        <svg viewBox="0 0 24 24">
            <path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/>
        </svg>
    </div>

    <div class="nav-arrow arrow-L" onclick="cycleNode(-1)">‹</div>
    <div class="nav-arrow arrow-R" onclick="cycleNode(1)">›</div>

    <div id="nexus-overlay">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <h1 id="node-title" style="margin:0; font-size: 1.1rem; letter-spacing: 4px; color: var(--glow);">GEORGIA AQUARIUM</h1>
            <p id="node-status" style="font-size: 0.6rem; opacity: 0.6; margin-top: 10px;">ACTIVE FEED: NODE_01</p>
            <a href="mailto:stakeme10000@gmail.com" class="btn">Request Console</a>
            <a href="https://architect-artemis.vercel.app/" target="_blank" class="btn" style="border-color:var(--gold); color:var(--gold);">Visit Olympus</a>
        </div>
    </div>

    <div class="hud" style="left: 30px;" id="hud-L">NODE: 01/23</div>

    <script>
        const nodes = [
            { id: "DHUnz4dyb54", name: "GEORGIA AQUARIUM" },
            { id: "XsOU8JnEpNM", name: "OL DONYO LODGE" },
            { id: "5e4lsEe4Vew", name: "WOLF CENTER NORTH" },
            { id: "3n-5EA9augs", name: "TEXAS WILDLIFE" },
            { id: "dIChLG4_WNs", name: "NKORHO BUSH LODGE" },
            { id: "ItdXaWUVF48", name: "ROSIE'S PAN AFRICA" },
            { id: "ydYDqZQpim8", name: "NAMIB DESERT LIVE" },
            { id: "S46DdA8Mc4I", name: "MAKOV STORK NEST" },
            { id: "qHXFLsnKDq0", name: "MOUNTAIN STREAM" },
            { id: "F0GOOP82094", name: "MORTEN HILMER FOREST" },
            { id: "4BrvMGznLTo", name: "MOUNTAIN WATERFALL" },
            { id: "ayMw6zvsUpQ", name: "PACIFIC REEF CAM" },
            { id: "iws3rh5vLAQ", name: "KILAUEA VOLCANO" },
            { id: "jzx_n25g3kA", name: "UTOPIA UNDERWATER" },
            { id: "ouWBQoVFegI", name: "BALD EAGLE NEST" },
            { id: "3szkFHfr6sA", name: "WOLONG PANDA GROVE" },
            { id: "FqQJmDiW0xs", name: "ANCIENT EGYPT LIVE" },
            { id: "aXAsMcmtJTc", name: "NETHERLANDS SEAL CAM" },
            { id: "qJ8lYplu1y0", name: "MAUNAKEA METEOR CAM" },
            { id: "yfSyjwY6zSQ", name: "GRACE GORILLA FOREST" },
            { id: "azNqXbUW-K4", name: "TROPICAL FISH CAM" },
            { id: "yuIm1V7Ne7I", name: "ONGUMA WATERHOLE" },
            { id: "QOzC_AbsPlw", name: "SPACE AMBIENT HUD" }
        ];

        let currentIndex = 0;
        const iframe = document.getElementById('yt-iframe');
        const engine = document.getElementById('engine');
        const overlay = document.getElementById('nexus-overlay');
        const huds = document.querySelectorAll('.hud');

        function updateNode() {
            const node = nodes[currentIndex];
            iframe.src = `https://www.youtube.com/embed/${node.id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${node.id}&rel=0&modestbranding=1`;
            document.getElementById('node-title').innerText = node.name;
            document.getElementById('node-status').innerText = `ACTIVE FEED: NODE_${String(currentIndex + 1).padStart(2, '0')}`;
            document.getElementById('hud-L').innerText = `NODE: ${String(currentIndex + 1).padStart(2, '0')}/23`;
        }

        function toggleMirror(e) {
            e.stopPropagation();
            engine.classList.toggle('mirrored');
        }

        function cycleNode(direction) {
            event.stopPropagation();
            currentIndex = (currentIndex + direction + nodes.length) % nodes.length;
            updateNode();
        }

        function toggleUI() {
            overlay.classList.toggle('hidden');
            huds.forEach(h => h.classList.toggle('hidden'));
        }

        updateNode();
    </script>
</body>
</html>
