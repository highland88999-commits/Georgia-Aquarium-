<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Multi-Node Console</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --glow: #00f2ff;
            --gold: #d4af37;
            --danger: #ff3366;
            --ui-bg: rgba(0, 10, 20, 0.85);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100dvh; /* dvh locks the viewport on mobile browsers */
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; /* Prevents pull-to-refresh on mobile */
        }

        /* Video Engine */
        .video-engine {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100dvh;
            z-index: 1;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease-in-out;
            opacity: 1;
            background-color: #000;
        }
        
        .video-engine.fade-out {
            opacity: 0;
        }

        #yt-iframe {
            width: 100vw; height: 56.25vw;
            min-height: 100dvh; min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            pointer-events: none;
        }

        /* Mirror Toggle Button */
        .mirror-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 250;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            opacity: 0.6;
        }
        .mirror-btn:hover {
            opacity: 1;
            border-color: var(--glow);
            box-shadow: 0 0 15px var(--glow);
        }
        .mirror-btn svg { width: 20px; fill: var(--glow); }
        .mirrored { transform: scaleX(-1); }

        /* UI Overlay */
        #nexus-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            transition: opacity 0.4s ease, visibility 0.4s;
            cursor: pointer;
        }

        .holo-frame {
            width: min(420px, 85vw);
            padding: 40px;
            background: var(--ui-bg);
            border: 2.5px solid var(--glow);
            border-radius: 30px;
            text-align: center;
            color: #fff;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        .btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--glow);
            color: var(--glow);
            background: rgba(0, 242, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover { background: var(--glow); color: #000; box-shadow: 0 0 15px var(--glow); }
        
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #000; box-shadow: 0 0 15px var(--danger); }

        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-row .btn { margin-top: 0; }

        .hud {
            position: fixed;
            bottom: 60px;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.6);
            z-index: 150;
            transition: 0.5s;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Swipe Indicator */
        .swipe-indicator {
            position: fixed;
            bottom: 60px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: var(--glow);
            z-index: 150;
            opacity: 0.5;
            transition: opacity 0.5s;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .swipe-indicator .chevron {
            font-size: 1.2rem;
            animation: swipe-pulse 2s infinite ease-in-out;
        }
        .swipe-indicator .chevron.left { animation-delay: 0s; }
        .swipe-indicator .chevron.right { animation-delay: 1s; }

        @keyframes swipe-pulse {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); text-shadow: 0 0 10px var(--glow); }
        }

        .hidden { opacity: 0 !important; visibility: hidden !important; transition: opacity 0.3s ease, visibility 0.3s; }
        
        .loading-text { color: var(--gold); animation: pulse 1.5s infinite; }

        /* Multiverse Tracker CSS Integration */
        .cyber-footer {
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            text-align: center; 
            padding: 12px 0;
            background: rgba(5, 5, 5, 0.85); 
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(0, 255, 255, 0.15); 
            z-index: 9999;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none; 
        }
        .visit-count {
            color: #00ffff; 
            font-size: 0.75rem; 
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8), 0 0 15px rgba(0, 255, 255, 0.4);
            letter-spacing: 1.5px; 
            text-transform: uppercase;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="engine" class="video-engine">
        <iframe id="yt-iframe" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="mirror-btn" onclick="toggleMirror(event)" title="Mirror Perspective">
        <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
    </div>

    <div id="nexus-overlay">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <h1 id="node-title" style="margin:0; font-size: 1.1rem; letter-spacing: 4px; color: var(--glow);">SYSTEM BOOT</h1>
            <p id="node-status" style="font-size: 0.6rem; opacity: 0.6; margin-top: 10px;">LOADING NODES...</p>
            
            <div class="btn-row">
                <button class="btn" onclick="promptAddNode()">+ Add Feed</button>
                <button class="btn btn-danger" onclick="removeCurrentNode()">- Remove Feed</button>
            </div>
            
            <a href="mailto:stakeme10000@gmail.com" class="btn">Request Console</a>
            <a href="https://architect-artemis.vercel.app/" target="_blank" class="btn" style="border-color:var(--gold); color:var(--gold);">Visit Olympus</a>
        </div>
    </div>

    <div class="hud" style="left: 30px;" id="hud-L">NODE: --/--</div>
    
    <div class="swipe-indicator hud">
        <span class="chevron left">‹‹</span> SWIPE NEXUS <span class="chevron right">››</span>
    </div>

    <footer class="cyber-footer">
        <div class="visit-count" id="counter-display">
            UPLINK ESTABLISHING <span class="loading-text">...</span>
        </div>
    </footer>

    <script>
        // ==========================================
        // SUPABASE UPLINK & CONFIGURATION
        // ==========================================
        const supabaseUrl = 'https://dfooodizpfqxcbhzadrb.supabase.co';
        const supabaseAnonKey = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmb29vZGl6cGZxeGNiaHphZHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTkwMTgsImV4cCI6MjA5OTE3NTAxOH0.Fl5cmNxR2wnZQW1tBIXFo6gG6E-mFdR4oAfy3rK4dq0';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

        // Core System Variables
        let nodes = [];
        let currentIndex = 0;
        const iframe = document.getElementById('yt-iframe');
        const engine = document.getElementById('engine');
        const overlay = document.getElementById('nexus-overlay');
        const huds = document.querySelectorAll('.hud');
        
        // Swipe & Fade tracking variables
        let touchStartX = 0;
        let touchEndX = 0;
        const swipeThreshold = 40; // Slightly lower threshold for easier swiping
        let isDragging = false;
        let isTransitioning = false; 
        let fadeTimeout;
        let safetyTimeout;

        // Fallback Database
        const defaultNodes = [
            { id: "DHUnz4dyb54", name: "GEORGIA AQUARIUM" },
            { id: "XsOU8JnEpNM", name: "OL DONYO LODGE" },
            { id: "5e4lsEe4Vew", name: "WOLF CENTER NORTH" },

            { id: "ItdXaWUVF48", name: "ROSIE'S PAN AFRICA" },
            { id: "ydYDqZQpim8", name: "NAMIB DESERT LIVE" },
            { id: "S46DdA8Mc4I", name: "MAKOV STORK NEST" },
            { id: "qHXFLsnKDq0", name: "MOUNTAIN STREAM" },
            { id: "F0GOOP82094", name: "MORTEN HILMER FOREST" },
            { id: "4BrvMGznLTo", name: "MOUNTAIN WATERFALL" },
            { id: "ayMw6zvsUpQ", name: "PACIFIC REEF CAM" },
            { id: "iws3rh5vLAQ", name: "KILAUEA VOLCANO" },
            { id: "jzx_n25g3kA", name: "UTOPIA UNDERWATER" },
            { id: "ouWBQoVFegI", name: "BALD EAGLE NEST" },
            { id: "3szkFHfr6sA", name: "WOLONG PANDA GROVE" },
            { id: "FqQJmDiW0xs", name: "ANCIENT EGYPT LIVE" },
            { id: "aXAsMcmtJTc", name: "NETHERLANDS SEAL CAM" },
            { id: "qJ8lYplu1y0", name: "MAUNAKEA METEOR CAM" },
            { id: "yfSyjwY6zSQ", name: "GRACE GORILLA FOREST" },
            { id: "azNqXbUW-K4", name: "TROPICAL FISH CAM" },
            { id: "yuIm1V7Ne7I", name: "ONGUMA WATERHOLE" },
            { id: "QOzC_AbsPlw", name: "SPACE AMBIENT HUD" },
            { id: "XyPU5-pNg5E", name: "AQUARIUM FEED 01" },
            { id: "Io1Kle7QR-E", name: "AQUARIUM FEED 02" },
            { id: "RZFMYVNhd4k", name: "AQUARIUM FEED 03" },

            { id: "HlJ4aRtYhoo", name: "AQUARIUM FEED 05" },

            { id: "tEtg5Kg3voQ", name: "AQUARIUM FEED 10" },

            { id: "fIMbMz2P7Bs", name: "AQUARIUM FEED 16" },
            { id: "h8O0UXsL7uk", name: "AQUARIUM FEED 17" },
            { id: "0FBiyFpV__g", name: "AQUARIUM FEED 18" },
            { id: "UDAZWxehMAI", name: "AQUARIUM FEED 19" },
            { id: "w3LjpFhySTg", name: "AQUARIUM FEED 20" },
            { id: "3e_uPkJCTNo", name: "AQUARIUM FEED 21" },
            { id: "ZrePsYz4c6g", name: "AQUARIUM FEED 22" },
            { id: "gJVnp5fF0vM", name: "AQUARIUM FEED 23" },
            { id: "-Vck0hn-zqk", name: "AQUARIUM FEED 24" },
            { id: "typxqJU-pFQ", name: "AQUARIUM FEED 25" },
            { id: "UpwNqncnqTE", name: "AQUARIUM FEED 26" },
            { id: "E0TZTmTK-Ws", name: "AQUARIUM FEED 27" }
        ];

        // ==========================================
        // NODE MANAGEMENT LOGIC
        // ==========================================
        
        async function initSystem() {
            document.getElementById('node-status').innerText = "ESTABLISHING DATABASE UPLINK...";
            
            const { data, error } = await supabaseClient
                .from('nexus_nodes')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Database connection failed:', error);
                document.getElementById('node-status').innerText = "UPLINK FAILED. USING LOCAL CACHE.";
                nodes = [...defaultNodes];
            } else if (data && data.length > 0) {
                nodes = data; 
            } else {
                nodes = [...defaultNodes];
            }
            
            updateNode();
        }

        function extractYouTubeID(url) {
            const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/|shorts\/))([\w-]{11})/;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }

        async function promptAddNode() {
            const url = prompt("Enter YouTube URL (Live, Shorts, or Standard):");
            if (!url) return;

            const ytId = extractYouTubeID(url);
            if (!ytId) {
                alert("SYSTEM ERROR: Invalid or unrecognizable YouTube URL format.");
                return;
            }

            const customName = prompt("Enter a Name for this feed:", "CUSTOM USER FEED") || "CUSTOM FEED";
            
            const { data, error } = await supabaseClient
                .from('nexus_nodes')
                .insert([{ id: ytId, name: customName.toUpperCase() }])
                .select(); 

            if (error) {
                console.error("Insert error:", error);
                alert("UPLOAD FAILED. Node ID may already exist in the database.");
                return;
            }

            nodes.push({ id: ytId, name: customName.toUpperCase() });
            currentIndex = nodes.length - 1;
            
            overlay.classList.add('hidden'); // Force UI close immediately
            updateNode();
        }

        async function removeCurrentNode() {
            if (nodes.length <= 1) {
                alert("SYSTEM LOCK: Cannot remove the final active feed.");
                return;
            }
            
            const nodeToDelete = nodes[currentIndex];
            
            if (confirm(`PURGE "${nodeToDelete.name}" FROM GLOBAL DATABASE?`)) {
                const { error } = await supabaseClient
                    .from('nexus_nodes')
                    .delete()
                    .eq('id', nodeToDelete.id);

                if (error) {
                    console.error("Delete error:", error);
                    alert("PURGE FAILED. Check console for details.");
                    return;
                }

                nodes.splice(currentIndex, 1);
                if (currentIndex >= nodes.length) currentIndex = 0;
                
                overlay.classList.add('hidden'); // Force UI close immediately
                updateNode();
            }
        }

        // ==========================================
        // UI, HARDWARE CONTROLS & SWIPE LOGIC
        // ==========================================
        
        function updateNode() {
            if(nodes.length === 0) return;
            const node = nodes[currentIndex];
            
            clearTimeout(fadeTimeout);
            clearTimeout(safetyTimeout);
            
            engine.classList.add('fade-out');
            
            // Show loading status in the HUD while screen is black
            const hudText = document.getElementById('hud-L');
            hudText.innerHTML = `[ <span class="loading-text">ESTABLISHING CONNECTION...</span> ]`;
            
            fadeTimeout = setTimeout(() => {
                iframe.src = `https://www.youtube.com/embed/${node.id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${node.id}&rel=0&modestbranding=1`;
                document.getElementById('node-title').innerText = node.name;
                document.getElementById('node-status').innerText = `ACTIVE FEED: NODE_${String(currentIndex + 1).padStart(2, '0')}`;
                
                // Wait for iframe to load before revealing
                iframe.onload = () => {
                    engine.classList.remove('fade-out');
                    hudText.innerText = `NODE: ${String(currentIndex + 1).padStart(2, '0')}/${nodes.length}`;
                    isTransitioning = false; 
                };

                // Fallback timeout in case YouTube API is slow
                safetyTimeout = setTimeout(() => {
                    engine.classList.remove('fade-out');
                    hudText.innerText = `NODE: ${String(currentIndex + 1).padStart(2, '0')}/${nodes.length}`;
                    isTransitioning = false;
                }, 2000);

            }, 500); 
        }

        function toggleMirror(e) {
            e.stopPropagation();
            engine.classList.toggle('mirrored');
        }

        function cycleNode(direction) {
            if (isTransitioning) return; 
            isTransitioning = true;
            currentIndex = (currentIndex + direction + nodes.length) % nodes.length;
            updateNode();
        }

        function toggleUI() {
            if (isTransitioning) return; // Prevent toggling UI while screen is black
            overlay.classList.toggle('hidden');
            huds.forEach(h => h.classList.toggle('hidden'));
        }

        function handleSwipe() {
            const distance = touchEndX - touchStartX;
            
            if (distance < -swipeThreshold) {
                cycleNode(1);
            } else if (distance > swipeThreshold) {
                cycleNode(-1);
            } else if (Math.abs(distance) < 5) {
                // Only toggle UI if it was a distinct tap (distance moved is less than 5px)
                toggleUI();
            }
        }

        // Touch Listeners (Mobile/Tablets)
        document.body.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.body.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            // Prevent interference if touching buttons or UI frame
            if(!e.target.closest('.holo-frame') && !e.target.closest('.mirror-btn')) {
                handleSwipe();
            }
        }, { passive: true });

        // Mouse Listeners (Desktop Drag-to-swipe)
        document.body.addEventListener('mousedown', (e) => {
            if(e.target.closest('.holo-frame') || e.target.closest('.mirror-btn')) return; 
            isDragging = true;
            touchStartX = e.screenX;
        });

        document.body.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            touchEndX = e.screenX;
            handleSwipe();
        });

        // ==========================================
        // MULTIVERSE TRACKER LOGIC
        // ==========================================
        
        async function updateMultiverseCount(isInitialLoad = false) {
            const displayElement = document.getElementById('counter-display');
            
            try {
                let visitorId = localStorage.getItem('nexus_visitor_id');
                if (!visitorId) {
                    visitorId = crypto.randomUUID();
                    localStorage.setItem('nexus_visitor_id', visitorId);
                }

                if (isInitialLoad) {
                    await supabaseClient.rpc('track_ping', { p_ip_hash: visitorId });
                }

                const { data: globalData } = await supabaseClient
                    .from('global_stats')
                    .select('total_pings')
                    .single();

                const { count: uniqueCount } = await supabaseClient
                    .from('unique_visitors')
                    .select('*', { count: 'exact', head: true });

                const total = globalData ? globalData.total_pings : 0;
                const unique = uniqueCount !== null ? uniqueCount : 0;
                
                displayElement.innerHTML = `
                    UNIQUE TRAVERSALS: [ <span style="color: #ff00ff; text-shadow: 0 0 10px #ff00ff;">${unique}</span> ] 
                    <span style="opacity: 0.5; margin: 0 10px;">///</span> 
                    TOTAL PINGS: [ <span style="color: #00ffff;">${total}</span> ]
                `;

            } catch (error) {
                console.error('Tracker Uplink failed:', error);
                displayElement.innerHTML = `MULTIVERSE NODE: [ <span style="color: #ff3366;">OFFLINE</span> ]`;
            }
        }

        // ==========================================
        // BOOT SEQUENCE
        // ==========================================
        window.addEventListener('load', () => {
            initSystem();
            updateMultiverseCount(true);
            setInterval(() => updateMultiverseCount(false), 60000);
        });
    </script>
