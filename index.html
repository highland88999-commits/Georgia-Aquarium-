<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multi-Node Console</title>
    <style>
        :root {
            --glow: #00f2ff;
            --gold: #d4af37;
            --ui-bg: rgba(0, 10, 20, 0.85);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
        }

        /* Fullscreen Video Engine */
        .video-engine {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            overflow: hidden;
            background: #000;
        }

        #yt-iframe {
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            pointer-events: none; /* Passes clicks to body for toggle */
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glow);
            color: var(--glow);
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.3s;
            backdrop-filter: blur(5px);
            user-select: none;
        }
        .nav-arrow:hover { background: var(--glow); color: #000; box-shadow: 0 0 20px var(--glow); }
        .arrow-L { left: 20px; }
        .arrow-R { right: 20px; }

        /* UI Central Console */
        #nexus-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            transition: opacity 0.8s, visibility 0.8s;
            cursor: pointer;
        }

        .holo-frame {
            width: min(360px, 85vw);
            padding: 40px;
            background: var(--ui-bg);
            border: 2px solid var(--glow);
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.3);
            text-align: center;
            color: #fff;
            pointer-events: auto;
        }

        .btn-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn {
            padding: 12px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            border: 1px solid var(--glow);
            color: var(--glow);
            background: rgba(0, 242, 255, 0.05);
        }
        .btn:hover { background: var(--glow); color: #000; }

        /* HUD Details */
        .hud {
            position: fixed;
            bottom: 30px;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
            z-index: 60;
            transition: 0.5s;
            text-transform: uppercase;
        }

        .hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
<body onclick="toggleUI()">

    <div class="video-engine">
        <iframe id="yt-iframe" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="nav-arrow arrow-L ui-element" onclick="cycleNode(-1)">‹</div>
    <div class="nav-arrow arrow-R ui-element" onclick="cycleNode(1)">›</div>

    <div id="nexus-overlay" class="ui-element">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <h1 id="node-title" style="margin:0; font-size: 1.2rem; letter-spacing: 4px; color: var(--glow);">GEORGIA AQUARIUM</h1>
            <p id="node-status" style="font-size: 0.6rem; opacity: 0.6; margin-top: 10px;">ACTIVE FEED: NODE_01</p>
            
            <div class="btn-stack">
                <a href="mailto:stakeme10000@gmail.com" class="btn">Request Console</a>
                <a href="https://architect-artemis.vercel.app/" target="_blank" class="btn" style="border-color:var(--gold); color:var(--gold);">Visit Olympus</a>
            </div>
            <p style="margin-top:20px; font-size: 0.5rem; opacity: 0.4;">[ CLICK ARROWS TO CYCLE • CLICK VOID TO HIDE ]</p>
        </div>
    </div>

    <div class="hud ui-element" style="left: 30px;" id="hud-L">NODE: 01/13</div>
    <div class="hud ui-element" style="right: 30px;">SIGNAL: ENCRYPTED</div>

    <script>
        const nodes = [
            { id: "DHUnz4dyb54", name: "GEORGIA AQUARIUM" },
            { id: "XsOU8JnEpNM", name: "OL DONYO LODGE - KENYA" },
            { id: "HfgIFGbdGJ0", name: "EARTH TV - WORLD VIEW" },
            { id: "5e4lsEe4Vew", name: "WOLF CENTER - NORTH" },
            { id: "3n-5EA9augs", name: "TEXAS WILDLIFE FEED" },
            { id: "EvsLqQS_80E", name: "CAT TV - BIRD WATCH" },
            { id: "dIChLG4_WNs", name: "NKORHO BUSH LODGE" },
            { id: "fO9e9jnhYK8", name: "ISS - 4K EARTH VIEW" },
            { id: "0FBiyFpV__g", name: "SPACE STATION LIVE" },
            { id: "ItdXaWUVF48", name: "ROSIE'S PAN - AFRICA" },
            { id: "ydYDqZQpim8", name: "NAMIB DESERT LIVE" },
            { id: "S46DdA8Mc4I", name: "MAKOV STORK NEST" },
            { id: "D_uuHn0-4_L08ZPQ", name: "EXPLORE - LIVE REEF" }
        ];

        let currentIndex = 0;
        const iframe = document.getElementById('yt-iframe');
        const title = document.getElementById('node-title');
        const status = document.getElementById('node-status');
        const hudL = document.getElementById('hud-L');
        const uiElements = document.querySelectorAll('.ui-element');

        function updateNode() {
            const node = nodes[currentIndex];
            const url = `https://www.youtube.com/embed/${node.id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${node.id}&rel=0&modestbranding=1`;
            iframe.src = url;
            title.innerText = node.name;
            status.innerText = `ACTIVE FEED: NODE_0${currentIndex + 1}`;
            hudL.innerText = `NODE: ${String(currentIndex + 1).padStart(2, '0')}/13`;
        }

        function cycleNode(direction) {
            event.stopPropagation();
            currentIndex = (currentIndex + direction + nodes.length) % nodes.length;
            updateNode();
        }

        function toggleUI() {
            uiElements.forEach(el => el.classList.toggle('hidden'));
        }

        // Initialize First Node
        updateNode();
    </script>
</body>
</html>
