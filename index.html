<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multi-Node Console</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --glow: #00f2ff;
            --gold: #d4af37;
            --danger: #ff3366;
            --ui-bg: rgba(0, 10, 20, 0.85);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            user-select: none; 
            -webkit-user-select: none;
        }

        .video-engine {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            overflow: hidden;
        }
        
        .video-engine.fade-out {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #yt-iframe {
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            pointer-events: none;
        }

        .mirror-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 250;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            opacity: 0.6;
        }
        .mirror-btn:hover {
            opacity: 1;
            border-color: var(--glow);
            box-shadow: 0 0 15px var(--glow);
        }
        .mirror-btn svg { width: 20px; fill: var(--glow); }
        .mirrored { transform: scaleX(-1); }

        #nexus-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            transition: opacity 0.5s ease;
        }

        .holo-frame {
            width: min(420px, 85vw);
            padding: 40px;
            background: var(--ui-bg);
            border: 2.5px solid var(--glow);
            border-radius: 30px;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
        }

        .btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--glow);
            color: var(--glow);
            background: rgba(0, 242, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: var(--glow); color: #000; box-shadow: 0 0 15px var(--glow); }

        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #000; }

        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-row .btn { margin-top: 0; }

        .hud {
            position: fixed;
            bottom: 60px;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            z-index: 150;
            transition: opacity 0.6s ease;
        }

        .swipe-indicator {
            position: fixed;
            bottom: 60px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: var(--glow);
            z-index: 150;
            opacity: 0.5;
            pointer-events: none;
        }

        .hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <div id="engine" class="video-engine">
        <iframe id="yt-iframe" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="mirror-btn" onclick="toggleMirror(event)" title="Mirror Perspective">
        <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
    </div>

    <div id="nexus-overlay">
        <div class="holo-frame" id="holo-frame">
            <h1 id="node-title" style="margin:0; font-size: 1.1rem; letter-spacing: 4px; color: var(--glow);">SYSTEM BOOT</h1>
            <p id="node-status" style="font-size: 0.6rem; opacity: 0.6; margin-top: 10px;">LOADING NODES...</p>
            
            <div class="btn-row">
                <button class="btn" onclick="promptAddNode()">+ Add Feed</button>
                <button class="btn btn-danger" onclick="removeCurrentNode()">- Remove Feed</button>
            </div>
            
            <a href="mailto:stakeme10000@gmail.com" class="btn">Request Console</a>
            <a href="https://architect-artemis.vercel.app/" target="_blank" class="btn" style="border-color:var(--gold); color:var(--gold);">Visit Olympus</a>
        </div>
    </div>

    <div class="hud" style="left: 30px;" id="hud-L">NODE: --/--</div>
    <div class="swipe-indicator hud">
        <span class="chevron left">‹‹</span> SWIPE NEXUS <span class="chevron right">››</span>
    </div>

    <script>
        // === SUPABASE & DEFAULT NODES (same as before) ===
        const supabaseUrl = 'https://dfooodizpfqxcbhzadrb.supabase.co';
        const supabaseAnonKey = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmb29vZGl6cGZxeGNiaHphZHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTkwMTgsImV4cCI6MjA5OTE3NTAxOH0.Fl5cmNxR2wnZQW1tBIXFo6gG6E-mFdR4oAfy3rK4dq0';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

        let nodes = [];
        let currentIndex = 0;
        const iframe = document.getElementById('yt-iframe');
        const engine = document.getElementById('engine');
        const overlay = document.getElementById('nexus-overlay');
        const holoFrame = document.getElementById('holo-frame');
        const huds = document.querySelectorAll('.hud');

        let touchStartX = 0;
        let touchEndX = 0;
        const swipeThreshold = 50;

        const defaultNodes = [ /* ... your full list of default nodes ... */ ];

        // ==================== CORE FUNCTIONS ====================
        async function initSystem() {
            // ... same as before (keep your original initSystem code)
            document.getElementById('node-status').innerText = "ESTABLISHING DATABASE UPLINK...";
            const { data, error } = await supabaseClient.from('nexus_nodes').select('*').order('created_at', { ascending: true });
            
            nodes = (error || !data || data.length === 0) ? [...defaultNodes] : data;
            updateNode();
        }

        function updateNode() {
            if (!nodes.length) return;
            const node = nodes[currentIndex];
            engine.classList.add('fade-out');
            
            setTimeout(() => {
                iframe.src = `https://www.youtube.com/embed/${node.id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${node.id}&rel=0&modestbranding=1`;
                document.getElementById('node-title').innerText = node.name;
                document.getElementById('node-status').innerText = `ACTIVE FEED: NODE_${String(currentIndex + 1).padStart(2, '0')}`;
                document.getElementById('hud-L').innerText = `NODE: ${String(currentIndex + 1).padStart(2, '0')}/${nodes.length}`;
                engine.classList.remove('fade-out');
            }, 350);
        }

        // ==================== UI TOGGLE ====================
        function showUI() {
            overlay.classList.remove('hidden');
            huds.forEach(h => h.classList.remove('hidden'));
        }

        function hideUI() {
            overlay.classList.add('hidden');
            huds.forEach(h => h.classList.add('hidden'));
        }

        function toggleMirror(e) {
            e.stopImmediatePropagation();
            engine.classList.toggle('mirrored');
        }

        function cycleNode(dir) {
            currentIndex = (currentIndex + dir + nodes.length) % nodes.length;
            updateNode();
        }

        // ==================== CLICK HANDLER ====================
        function handleDocumentClick(e) {
            const isOverlayVisible = !overlay.classList.contains('hidden');
            
            if (isOverlayVisible) {
                // If UI is visible and user clicked outside the frame → hide
                if (!holoFrame.contains(e.target) && !e.target.closest('.mirror-btn')) {
                    hideUI();
                }
            } else {
                // If UI is hidden → show it (except mirror button)
                if (!e.target.closest('.mirror-btn')) {
                    showUI();
                }
            }
        }

        function handleSwipe() {
            const distance = touchEndX - touchStartX;
            if (distance < -swipeThreshold) cycleNode(1);
            else if (distance > swipeThreshold) cycleNode(-1);
        }

        // ==================== BOOT ====================
        window.addEventListener('load', () => {
            initSystem();

            // Main click handler
            document.addEventListener('click', handleDocumentClick);

            // Touch swipe
            document.addEventListener('touchstart', e => {
                if (holoFrame.contains(e.target)) return;
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            document.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            // Mouse swipe
            let mouseDownX = 0;
            document.addEventListener('mousedown', e => {
                if (holoFrame.contains(e.target)) return;
                mouseDownX = e.screenX;
            });

            document.addEventListener('mouseup', e => {
                if (holoFrame.contains(e.target)) return;
                const dist = e.screenX - mouseDownX;
                if (Math.abs(dist) > swipeThreshold) {
                    cycleNode(dist > 0 ? -1 : 1);
                }
            });
        });
    </script>

    <!-- Tracking script (unchanged) -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const trackingUrl = 'https://ezfwzqxwafvdjtwnmyrx.supabase.co';
        const trackingKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6Znd6cXh3YWZ2ZGp0d25teXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwOTA2NzIsImV4cCI6MjA5NzY2NjY3Mn0.baxnDWZ9rSZobzqnAOND7SuJpXbl4wmRyUYTQl4whPE';
        const trackingClient = createClient(trackingUrl, trackingKey);

        async function silentUplink() {
            try {
                const id = localStorage.getItem('nexus_visitor_id') || crypto.randomUUID?.() || 'fallback-id';
                localStorage.setItem('nexus_visitor_id', id);
                await trackingClient.rpc('track_ping', { p_ip_hash: id });
            } catch {}
        }

        window.addEventListener('load', () => {
            silentUplink();
            setInterval(silentUplink, 60000);
        });
    </script>
</body>
</html>
