<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Aquarium - Tropical Reef</title>
    <style>
        :root {
            --glow-color: rgba(0, 195, 255, 0.9);
            --glass-bg: rgba(0, 0, 0, 0.95); /* Nearly solid to block the rain */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
        }

        /* Video Layering */
        .base-background {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* YouTube Feed - Repaired for Rain Occlusion */
        #youtube-container {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 320px;
            height: 180px;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid var(--glow-color);
            border-radius: 12px;
            overflow: hidden;
            background: #000; /* Solid black base blocks rain */
        }

        #youtube-container.expanded {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100; /* This pushes it ABOVE the main page rain */
            border-radius: 0;
            border: none;
        }

        #youtube-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* UI Overlays */
        #ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .holo-frame {
            width: min(350px, 90vw);
            padding: 30px;
            background: var(--glass-bg);
            border: 1.5px solid var(--glow-color);
            border-radius: 24px;
            box-shadow: 0 0 30px var(--glow-color);
            text-align: center;
            color: white;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            border: 1px solid var(--glow-color);
            color: #fff;
            background: rgba(0, 195, 255, 0.1);
        }

        .btn:hover { background: var(--glow-color); color: #000; }

        .icon-btn {
            position: fixed;
            z-index: 150; /* Above everything */
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--glow-color);
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
            transition: 0.4s;
        }

        #toggle-feed { top: 15px; left: 15px; }
        #fs-toggle { top: 15px; right: 15px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <button id="toggle-feed" class="icon-btn" onclick="toggleYoutube()">Toggle Reef Feed</button>
    <button id="fs-toggle" class="icon-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>

    <div class="base-background">
        <video id="bg-video" autoplay muted loop playsinline>
            <source src="https://w6gqoaajkeprilw9.public.blob.vercel-storage.com/nexus_render%20%289%29.webm" type="video/webm">
        </video>
    </div>

    <div id="youtube-container">
        <iframe src="https://www.youtube.com/embed/DHUnz4dyb54?autoplay=1&mute=1&controls=0&loop=1&playlist=DHUnz4dyb54&rel=0" allow="autoplay; fullscreen"></iframe>
    </div>

    <div id="ui-overlay" onclick="this.classList.add('hidden')">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <h2 style="margin-top:0; letter-spacing: 2px;">GEORGIA AQUARIUM</h2>
            <div class="btn-stack">
                <a href="#" class="btn" onclick="toggleYoutube()">Maximize Reef</a>
                <a href="https://www.georgiaaquarium.org/webcam/indo-pacific-barrier-reef/" target="_blank" class="btn">External Link</a>
            </div>
        </div>
    </div>

    <script>
        function toggleYoutube() {
            const yt = document.getElementById('youtube-container');
            yt.classList.toggle('expanded');
            // If expanded, it will now sit at z-index 100, blocking the rain on the parent page
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
