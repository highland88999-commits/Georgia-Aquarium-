<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Aquarium • Immersive Node</title>
    <style>
        :root {
            --glow: #00f2ff;
            --gold: #d4af37;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
        }

        /* The Fullscreen Container */
        .immersive-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        /* The Video: Forces 16:9 to cover any screen ratio */
        #yt-iframe {
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            min-height: 100vh;
            min-width: 177.77vh; /* 16:9 ratio */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            pointer-events: none; /* Allows clicks to pass to the body */
        }

        /* The Interaction Layer */
        #nexus-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
            cursor: pointer;
        }

        .holo-frame {
            width: min(340px, 85vw);
            padding: 40px;
            background: rgba(0, 15, 30, 0.85);
            border: 2px solid var(--glow);
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.4), inset 0 0 20px rgba(0, 242, 255, 0.2);
            text-align: center;
            color: #fff;
            pointer-events: auto; /* Buttons are clickable */
        }

        .btn-stack { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .btn {
            padding: 14px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
            border: 1px solid var(--glow);
            color: var(--glow);
            background: rgba(0, 242, 255, 0.05);
        }
        .btn:hover { background: var(--glow); color: #000; box-shadow: 0 0 20px var(--glow); }

        .btn.gold { border-color: var(--gold); color: var(--gold); }
        .btn.gold:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }

        /* HUD Details */
        .hud-text {
            position: fixed;
            bottom: 30px;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            z-index: 11;
            transition: 0.5s;
        }

        .hidden { opacity: 0; visibility: hidden; }
    </style>
</head>
<body onclick="toggleNexus()">

    <div class="immersive-container">
        <iframe id="yt-iframe" 
            src="https://www.youtube.com/embed/DHUnz4dyb54?autoplay=1&mute=1&controls=0&loop=1&playlist=DHUnz4dyb54&rel=0&modestbranding=1&enablejsapi=1" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <div id="nexus-overlay">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <h1 style="margin:0; font-size: 1.5rem; letter-spacing: 5px; text-shadow: 0 0 15px var(--glow);">AQUARIUM</h1>
            <div style="height: 1px; background: linear-gradient(90deg, transparent, var(--glow), transparent); margin: 15px 0;"></div>
            <p style="font-size: 0.7rem; opacity: 0.7;">GEORGIA NODE • LIVE STREAM ACTIVE</p>
            
            <div class="btn-stack">
                <a href="mailto:stakeme10000@gmail.com" class="btn">Request Console</a>
                <a href="https://www.georgiaaquarium.org" target="_blank" class="btn gold">Access Mainframe</a>
            </div>
            
            <p style="margin-top: 25px; font-size: 0.6rem; opacity: 0.4;">[ TAP VOID TO IMMERSE ]</p>
        </div>
    </div>

    <div class="hud-text" style="left: 30px;">STATION: GEORGIA_REEL_09</div>
    <div class="hud-text" style="right: 30px;">STATUS: ENCRYPTED</div>

    <script>
        const overlay = document.getElementById('nexus-overlay');
        const huds = document.querySelectorAll('.hud-text');

        function toggleNexus() {
            const isHidden = overlay.classList.contains('hidden');
            if (isHidden) {
                overlay.classList.remove('hidden');
                huds.forEach(h => h.style.opacity = "1");
            } else {
                overlay.classList.add('hidden');
                huds.forEach(h => h.style.opacity = "0");
            }
        }

        // Ensure clicking inside the frame doesn't toggle the UI
        document.querySelector('.holo-frame').addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
