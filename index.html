<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multi-Node Console</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --glow: #00f2ff;
            --gold: #d4af37;
            --danger: #ff3366;
            --ui-bg: rgba(0, 10, 20, 0.85);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* Video Engine */
        .video-engine {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease-in-out;
            opacity: 1;
        }
        
        .video-engine.fade-out {
            opacity: 0;
        }

        #yt-iframe {
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            pointer-events: none;
        }

        /* Mirror Toggle Button */
        .mirror-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 250;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            opacity: 0.6;
        }
        .mirror-btn:hover {
            opacity: 1;
            border-color: var(--glow);
            box-shadow: 0 0 15px var(--glow);
        }
        .mirror-btn svg { width: 20px; fill: var(--glow); }
        .mirrored { transform: scaleX(-1); }

        /* UI Overlay */
        #nexus-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .holo-frame {
            width: min(420px, 85vw);
            padding: 40px;
            background: var(--ui-bg);
            border: 2.5px solid var(--glow);
            border-radius: 30px;
            text-align: center;
            color: #fff;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        .btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--glow);
            color: var(--glow);
            background: rgba(0, 242, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover { background: var(--glow); color: #000; box-shadow: 0 0 15px var(--glow); }
        
        .btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger); color: #000; box-shadow: 0 0 15px var(--danger);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-row .btn { margin-top: 0; }

        .hud {
            position: fixed;
            bottom: 60px;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            z-index: 150;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        /* Swipe Indicator */
        .swipe-indicator {
            position: fixed;
            bottom: 60px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: var(--glow);
            z-index: 150;
            opacity: 0.5;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .swipe-indicator .chevron {
            font-size: 1.2rem;
            animation: swipe-pulse 2s infinite ease-in-out;
        }
        .swipe-indicator .chevron.left { animation-delay: 0s; }
        .swipe-indicator .chevron.right { animation-delay: 1s; }

        @keyframes swipe-pulse {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); text-shadow: 0 0 10px var(--glow); }
        }

        .hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <div id="engine" class="video-engine">
        <iframe id="yt-iframe" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="mirror-btn" onclick="toggleMirror(event)" title="Mirror Perspective">
        <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
    </div>

    <div id="nexus-overlay">
        <div class="holo-frame">
            <h1 id="node-title" style="margin:0; font-size: 1.1rem; letter-spacing: 4px; color: var(--glow);">SYSTEM BOOT</h1>
            <p id="node-status" style="font-size: 0.6rem; opacity: 0.6; margin-top: 10px;">LOADING NODES...</p>
            
            <div class="btn-row">
                <button class="btn" onclick="promptAddNode()">+ Add Feed</button>
                <button class="btn btn-danger" onclick="removeCurrentNode()">- Remove Feed</button>
            </div>
            
            <a href="mailto:stakeme10000@gmail.com" class="btn">Request Console</a>
            <a href="https://architect-artemis.vercel.app/" target="_blank" class="btn" style="border-color:var(--gold); color:var(--gold);">Visit Olympus</a>
        </div>
    </div>

    <div class="hud" style="left: 30px;" id="hud-L">NODE: --/--</div>
    
    <div class="swipe-indicator hud">
        <span class="chevron left">‹‹</span> SWIPE NEXUS <span class="chevron right">››</span>
    </div>

    <script>
        // ==========================================
        // SUPABASE UPLINK & CONFIGURATION
        // ==========================================
        const supabaseUrl = 'https://dfooodizpfqxcbhzadrb.supabase.co';
        const supabaseAnonKey = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmb29vZGl6cGZxeGNiaHphZHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTkwMTgsImV4cCI6MjA5OTE3NTAxOH0.Fl5cmNxR2wnZQW1tBIXFo6gG6E-mFdR4oAfy3rK4dq0';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

        // Core System Variables
        let nodes = [];
        let currentIndex = 0;
        const iframe = document.getElementById('yt-iframe');
        const engine = document.getElementById('engine');
        const overlay = document.getElementById('nexus-overlay');
        const huds = document.querySelectorAll('.hud');
        
        // Interaction variables
        let touchStartX = 0;
        let touchEndX = 0;
        const swipeThreshold = 50; 
        let isDragging = false;

        // Default Nodes
        const defaultNodes = [
            { id: "DHUnz4dyb54", name: "GEORGIA AQUARIUM" },
            { id: "XsOU8JnEpNM", name: "OL DONYO LODGE" },
            { id: "5e4lsEe4Vew", name: "WOLF CENTER NORTH" },
            { id: "3n-5EA9augs", name: "TEXAS WILDLIFE" },
            { id: "dIChLG4_WNs", name: "NKORHO BUSH LODGE" },
            { id: "ItdXaWUVF48", name: "ROSIE'S PAN AFRICA" },
            { id: "ydYDqZQpim8", name: "NAMIB DESERT LIVE" },
            // ... (all your other default nodes remain the same)
            { id: "E0TZTmTK-Ws", name: "AQUARIUM FEED 27" }
        ];

        // ==========================================
        // NODE MANAGEMENT
        // ==========================================
        async function initSystem() {
            document.getElementById('node-status').innerText = "ESTABLISHING DATABASE UPLINK...";
            
            const { data, error } = await supabaseClient
                .from('nexus_nodes')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Database connection failed:', error);
                document.getElementById('node-status').innerText = "UPLINK FAILED. USING LOCAL CACHE.";
                nodes = [...defaultNodes];
            } else if (data && data.length > 0) {
                nodes = data; 
            } else {
                nodes = [...defaultNodes];
            }
            updateNode();
        }

        function extractYouTubeID(url) {
            const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/|shorts\/))([\w-]{11})/;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }

        async function promptAddNode() {
            const url = prompt("Enter YouTube URL (Live, Shorts, or Standard):");
            if (!url) return;

            const ytId = extractYouTubeID(url);
            if (!ytId) {
                alert("SYSTEM ERROR: Invalid or unrecognizable YouTube URL format.");
                return;
            }

            const customName = prompt("Enter a Name for this feed:", "CUSTOM USER FEED") || "CUSTOM FEED";
            
            const { data, error } = await supabaseClient
                .from('nexus_nodes')
                .insert([{ id: ytId, name: customName.toUpperCase() }])
                .select(); 

            if (error) {
                console.error("Insert error:", error);
                alert("UPLOAD FAILED. Node ID may already exist in the database.");
                return;
            }

            nodes.push({ id: ytId, name: customName.toUpperCase() });
            currentIndex = nodes.length - 1;
            updateNode();
            hideUI(); 
        }

        async function removeCurrentNode() {
            if (nodes.length <= 1) {
                alert("SYSTEM LOCK: Cannot remove the final active feed.");
                return;
            }
            
            const nodeToDelete = nodes[currentIndex];
            
            if (confirm(`PURGE "${nodeToDelete.name}" FROM GLOBAL DATABASE?`)) {
                const { error } = await supabaseClient
                    .from('nexus_nodes')
                    .delete()
                    .eq('id', nodeToDelete.id);

                if (error) {
                    console.error("Delete error:", error);
                    alert("PURGE FAILED. Check console for details.");
                    return;
                }

                nodes.splice(currentIndex, 1);
                if (currentIndex >= nodes.length) currentIndex = 0;
                updateNode();
            }
        }

        // ==========================================
        // UI & INTERACTION
        // ==========================================
        function updateNode() {
            if(nodes.length === 0) return;
            const node = nodes[currentIndex];
            
            engine.classList.add('fade-out');
            
            setTimeout(() => {
                iframe.src = `https://www.youtube.com/embed/${node.id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${node.id}&rel=0&modestbranding=1`;
                document.getElementById('node-title').innerText = node.name;
                document.getElementById('node-status').innerText = `ACTIVE FEED: NODE_${String(currentIndex + 1).padStart(2, '0')}`;
                document.getElementById('hud-L').innerText = `NODE: ${String(currentIndex + 1).padStart(2, '0')}/${nodes.length}`;
                engine.classList.remove('fade-out');
            }, 300);
        }

        function toggleMirror(e) {
            e.stopPropagation();
            engine.classList.toggle('mirrored');
        }

        function cycleNode(direction) {
            currentIndex = (currentIndex + direction + nodes.length) % nodes.length;
            updateNode();
        }

        function hideUI() {
            overlay.classList.add('hidden');
            huds.forEach(h => h.classList.add('hidden'));
        }

        function showUI() {
            overlay.classList.remove('hidden');
            huds.forEach(h => h.classList.remove('hidden'));
        }

        // Click outside frame → hide
        function handleOverlayClick(e) {
            if (e.target.id === 'nexus-overlay') {
                hideUI();
            }
        }

        // When UI is hidden, click anywhere → show
        function handleBackgroundClick(e) {
            if (overlay.classList.contains('hidden') && 
                !e.target.closest('.mirror-btn')) {
                showUI();
            }
        }

        function handleSwipe() {
            const distance = touchEndX - touchStartX;
            if (distance < -swipeThreshold) cycleNode(1);
            else if (distance > swipeThreshold) cycleNode(-1);
        }

        function isInteractiveTarget(e) {
            return e.target.closest('.holo-frame') || e.target.closest('.mirror-btn');
        }

        // ==========================================
        // BOOT
        // ==========================================
        window.addEventListener('load', () => {
            initSystem();

            // Click on overlay background to hide
            overlay.addEventListener('click', handleOverlayClick);

            // Click anywhere when hidden to show
            document.body.addEventListener('click', handleBackgroundClick);

            // Touch support
            document.body.addEventListener('touchstart', (e) => {
                if (isInteractiveTarget(e)) return;
                isDragging = true;
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            document.body.addEventListener('touchend', (e) => {
                if (!isDragging) return;
                isDragging = false;
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            // Mouse support
            document.body.addEventListener('mousedown', (e) => {
                if (isInteractiveTarget(e)) return;
                isDragging = true;
                touchStartX = e.screenX;
            });

            document.body.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                touchEndX = e.screenX;
                handleSwipe();
            });
        });
    </script>

    <!-- Tracking script (unchanged) -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const trackingUrl = 'https://ezfwzqxwafvdjtwnmyrx.supabase.co';
        const trackingKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6Znd6cXh3YWZ2ZGp0d25teXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwOTA2NzIsImV4cCI6MjA5NzY2NjY3Mn0.baxnDWZ9rSZobzqnAOND7SuJpXbl4wmRyUYTQl4whPE';
        const trackingClient = createClient(trackingUrl, trackingKey);

        function getSafeVisitorId() {
            let id = localStorage.getItem('nexus_visitor_id');
            if (!id) {
                if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                    id = crypto.randomUUID();
                } else {
                    id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                }
                localStorage.setItem('nexus_visitor_id', id);
            }
            return id;
        }

        async function silentUplink() {
            try {
                const visitorId = getSafeVisitorId();
                await trackingClient.rpc('track_ping', { p_ip_hash: visitorId });
            } catch (error) {}
        }

        window.addEventListener('load', () => {
            silentUplink();
            setInterval(silentUplink, 60000); 
        });
    </script>
</body>
</html>
