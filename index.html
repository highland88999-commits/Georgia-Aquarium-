<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multi-Node Console</title>
    <style>
        :root {
            --glow: #00f2ff;
            --gold: #d4af37;
            --ui-bg: rgba(0, 10, 20, 0.92);
            --transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            color: #fff;
        }

        /* The Core Engine: Dedicated layer for Streaming Content */
        .video-engine {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        #nexus-view {
            width: 100%; height: 100%;
            border: none;
            transition: opacity 0.5s ease;
        }

        /* Interface Overlay Layer */
        .ui-layer {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none; /* Allows clicking through to the video if needed */
        }

        /* Holographic Navigation HUD */
        .node-info {
            position: absolute;
            top: 40px;
            left: 40px;
            pointer-events: auto;
        }

        #node-title {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 8px;
            color: var(--glow);
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
            text-transform: uppercase;
        }

        .hud-details {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 10px;
            letter-spacing: 3px;
        }

        /* Tactical Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--glow);
            font-size: 4rem;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0.2;
            transition: 0.3s;
            user-select: none;
            padding: 20px;
        }
        .nav-arrow:hover { opacity: 1; text-shadow: 0 0 20px var(--glow); }
        .arrow-L { left: 20px; }
        .arrow-R { right: 20px; }

        /* Tactical Orbs: Bottom Navigation Points */
        .orb-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            pointer-events: auto;
        }

        .orb {
            width: 55px; height: 55px;
            border-radius: 50%;
            border: 1px solid var(--glow);
            background: rgba(0, 242, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            font-size: 1.2rem;
        }

        .orb:hover {
            background: var(--glow);
            box-shadow: 0 0 30px var(--glow);
            transform: scale(1.2) translateY(-10px);
            color: #000;
        }

        /* Holoframe Window: The Popup Terminal */
        #holo-window {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw; height: 80vh;
            background: var(--ui-bg);
            border: 1px solid var(--glow);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            transition: 0.5s ease-out;
        }

        .holo-header {
            padding: 15px 25px;
            background: rgba(0, 242, 255, 0.15);
            color: var(--glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
            letter-spacing: 3px;
            font-size: 0.8rem;
        }

        .close-btn {
            cursor: pointer;
            color: #ff4444;
            font-weight: bold;
        }

        #holo-view {
            flex: 1;
            border: none;
            background: #000;
        }

        /* Utility Classes */
        .hidden { 
            opacity: 0 !important; 
            visibility: hidden !important; 
            transform: translate(-50%, -40%) scale(0.9) !important; 
        }

    </style>
</head>
<body>

    <div class="video-engine">
        <webview id="nexus-view" 
                 partition="persist:nexus"
                 style="width:100%; height:100%;"
                 allowpopups>
        </webview>
    </div>

    <div class="ui-layer">
        <div class="node-info">
            <h1 id="node-title">INITIALIZING_CONS_...</h1>
            <div class="hud-details" id="hud-info">NODE: 00/00 | STATUS: ACTIVE</div>
        </div>

        <div class="nav-arrow arrow-L" onclick="cycleNode(-1, event)">‹</div>
        <div class="nav-arrow arrow-R" onclick="cycleNode(1, event)">›</div>

        <div class="orb-container">
            <div class="orb" onclick="openHoloWindow('mailto:stakeme10000@gmail.com', 'ENCRYPTED_COMMS')" title="Request Console">📩</div>
            <div class="orb" onclick="openHoloWindow('https://architect-artemis.vercel.app/', 'OLYMPUS_TERMINAL')" title="Visit Olympus" style="border-color: var(--gold); color: var(--gold);">🏛️</div>
        </div>
    </div>

    <div id="holo-window" class="hidden">
        <div class="holo-header">
            <span id="holo-title">DATA_STREAM</span>
            <span class="close-btn" onclick="closeHolo()">[ DISCONNECT ]</span>
        </div>
        <webview id="holo-view" partition="persist:nexus" style="width:100%; height:100%;"></webview>
    </div>

    <script src="renderer.js"></script>

</body>
</html>
