<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Aquarium - Tropical Reef</title>
    <style>
        :root {
            --glow-color: #00c3ff;
            --gold: #ffd700;
            --glass: rgba(0, 0, 0, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Layer 1: The Base Vercel Blob Video (The "Black Space" Filler) */
        .base-render {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        #bg-render {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Layer 2: The YouTube Feed (Maximize-able) */
        #yt-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 320px;
            height: 180px;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid var(--glow-color);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #yt-wrapper.maximized {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50; /* Above base render, behind UI */
            border-radius: 0;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Layer 3: The UI Overlay */
        #ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .holo-frame {
            width: 300px;
            padding: 35px;
            background: var(--glass);
            border: 1.5px solid var(--glow-color);
            border-radius: 24px;
            box-shadow: 0 0 30px var(--glow-color);
            text-align: center;
            color: white;
            pointer-events: auto; /* Ensures frame clicks don't trigger the toggle */
        }

        .btn-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn {
            padding: 12px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            transition: 0.3s;
            border: 1px solid var(--glow-color);
            color: white;
            background: rgba(0, 195, 255, 0.1);
        }
        .btn:hover { background: var(--glow-color); color: #000; }
        .olympian { border-color: var(--gold); color: var(--gold); }
        .olympian:hover { background: var(--gold); }

        /* Controls */
        .fixed-nav { position: fixed; z-index: 110; transition: 0.5s; }
        .top-L { top: 20px; left: 20px; }
        .top-R { top: 20px; right: 20px; }
        .bot-L { bottom: 30px; left: 30px; }
        .bot-R { bottom: 30px; right: 30px; }

        .icon-btn {
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--glow-color);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
<body onclick="toggleUI()">

    <div class="base-render">
        <video id="bg-render" autoplay muted loop playsinline>
            <source src="https://w6gqoaajkeprilw9.public.blob.vercel-storage.com/nexus_render%20%289%29.webm" type="video/webm">
        </video>
    </div>

    <div id="yt-wrapper" onclick="event.stopPropagation()">
        <iframe src="https://www.youtube.com/embed/DHUnz4dyb54?autoplay=1&mute=1&controls=0&loop=1&playlist=DHUnz4dyb54&rel=0" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="fixed-nav top-L ui-element">
        <button class="icon-btn" onclick="maximizeFeed(event)">Toggle Max Feed</button>
    </div>

    <div class="fixed-nav top-R ui-element">
        <button class="icon-btn" onclick="toggleFullScreen(event)">⛶ Fullscreen</button>
    </div>

    <div id="ui-overlay" class="ui-element">
        <div class="holo-frame" onclick="event.stopPropagation()">
            <h2 style="margin:0; letter-spacing: 2px;">GEORGIA AQUARIUM</h2>
            <div class="btn-stack">
                <a href="mailto:stakeme10000@gmail.com" class="btn olympian">Request Olympian Console</a>
                <a href="https://www.georgiaaquarium.org" target="_blank" class="btn">External Portal</a>
            </div>
        </div>
    </div>

    <div class="fixed-nav bot-L ui-element">
        <a href="https://architect-artemis.vercel.app/" target="_blank" class="icon-btn" style="color:var(--gold); border-color:var(--gold);">Visit Olympus</a>
    </div>

    <div class="fixed-nav bot-R ui-element">
        <a href="https://explore.org" target="_blank" class="icon-btn">Explore.org</a>
    </div>

    <script>
        const uiElements = document.querySelectorAll('.ui-element');
        const ytWrapper = document.getElementById('yt-wrapper');

        function toggleUI() {
            uiElements.forEach(el => el.classList.toggle('hidden'));
        }

        function maximizeFeed(e) {
            e.stopPropagation();
            ytWrapper.classList.toggle('maximized');
        }

        function toggleFullScreen(e) {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Auto-hide UI in Fullscreen for immersion
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                uiElements.forEach(el => el.classList.add('hidden'));
            } else {
                uiElements.forEach(el => el.classList.remove('hidden'));
            }
        });
    </script>
</body>
</html>
